<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Clinic wait time</title>
<style>
:root {
  --bg: #f4f8fa; --surface: #ffffff; --ink: #11262e; --muted: #42606b;
  --line: #c4d4da; --control: #6a8794; --accent: #075e78; --on-accent: #ffffff;
  --ok: #1b6b3a; --warn: #8a5a00; --closed: #5b4a6e; --bad: #9b1c1c;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1a1f; --surface: #16262d; --ink: #e8f1f4; --muted: #9db6bf;
    --line: #2c4650; --control: #7d98a3; --accent: #5cc0dd; --on-accent: #08232b;
    --ok: #6fd391; --warn: #f0c060; --closed: #c2b0da; --bad: #ff9b9b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1a1f; --surface: #16262d; --ink: #e8f1f4; --muted: #9db6bf;
  --line: #2c4650; --control: #7d98a3; --accent: #5cc0dd; --on-accent: #08232b;
  --ok: #6fd391; --warn: #f0c060; --closed: #c2b0da; --bad: #ff9b9b;
  color-scheme: dark;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 1rem/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
}
main { max-width: 34rem; margin: 0 auto; padding: 1.5rem 1.25rem 2rem; }
.clinic { margin: 0 0 1.25rem; font-size: 1.125rem; color: var(--muted); }
.status {
  background: var(--surface); border: 1px solid var(--line);
  border-left: 0.5rem solid var(--accent); border-radius: 0.25rem;
  padding: 1.25rem 1.25rem 1rem;
}
.status[data-kind="wait"], .status[data-kind="zero"] { border-left-color: var(--ok); }
.status[data-kind="aging"], .status[data-kind="stale"], .status[data-kind="nodata"] { border-left-color: var(--warn); }
.status[data-kind="closed"] { border-left-color: var(--closed); }
h1 { margin: 0 0 0.5rem; font-size: clamp(2rem, 9vw, 3rem); line-height: 1.1; font-weight: 700; letter-spacing: -0.01em; }
.detail { margin: 0 0 0.75rem; font-size: 1.25rem; }
.updated { margin: 0; color: var(--muted); font-size: 1.0625rem; }
.call {
  display: block; margin: 1.25rem 0 0; padding: 0.9rem 1rem; min-height: 3rem; box-sizing: border-box;
  text-align: center; font-size: 1.25rem; font-weight: 600; text-decoration: none;
  background: var(--accent); color: var(--on-accent); border-radius: 0.25rem;
}
.call[hidden] { display: none; }
.emergency { margin: 1.5rem 0 0; color: var(--muted); font-size: 1rem; }
.stafflink { display: inline-flex; align-items: center; min-height: 3rem; margin-top: 1rem; color: var(--muted); font-size: 1rem; }
a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible {
  outline: 3px solid var(--ink); outline-offset: 2px;
}
.staff { margin-top: 1.5rem; }
.staff[hidden], .stafflink[hidden] { display: none; }
.staff h2 { margin: 0 0 0.75rem; font-size: 1.5rem; }
.back { display: inline-flex; align-items: center; min-height: 3rem; margin: 0 0 0.5rem; color: var(--accent); font-weight: 600; }
.now { margin: 0 0 0.5rem; font-size: 1.125rem; }
.nudge { margin: 0 0 1rem; padding: 0.75rem 1rem; border: 2px solid var(--warn); border-radius: 0.25rem; font-weight: 600; }
.nudge[hidden] { display: none; }
.confirm { width: 100%; margin: 0 0 1.25rem; font-weight: 600; border-color: var(--accent); }
.confirm[hidden] { display: none; }
fieldset { border: 0; padding: 0; margin: 0 0 1.25rem; }
legend, label.lbl { display: block; margin: 0 0 0.5rem; font-weight: 700; font-size: 1.125rem; }
.row { display: flex; flex-wrap: wrap; gap: 0.5rem; }
.btn {
  min-height: 3rem; min-width: 3rem; box-sizing: border-box; padding: 0.5rem 1rem;
  font: inherit; font-size: 1.125rem; color: var(--ink); background: var(--surface);
  border: 2px solid var(--control); border-radius: 0.25rem; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center;
}
.btn[aria-pressed="true"] { border-color: var(--accent); background: var(--accent); color: var(--on-accent); font-weight: 700; }
.readout { font-size: 1.5rem; font-weight: 700; margin: 0 0 0.75rem; }
.choice { display: flex; align-items: center; gap: 0.6rem; min-height: 3rem; margin: 0 0 0.25rem; }
.choice input[type="radio"], .hrow input[type="checkbox"] { width: 1.5rem; height: 1.5rem; margin: 0; accent-color: var(--accent); flex: none; }
.choice input[type="time"] { margin-left: 0.25rem; }
.hrow { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; margin: 0 0 0.5rem; }
.hrow .day { flex: 0 0 5.5rem; font-weight: 600; }
.hrow .on { display: inline-flex; align-items: center; gap: 0.4rem; min-height: 3rem; }
.hrow .sep { color: var(--muted); }
input[type="tel"], input[type="time"], select {
  box-sizing: border-box; min-height: 3rem; padding: 0.5rem 0.75rem;
  font: inherit; font-size: 1.125rem; color: var(--ink); background: var(--surface);
  border: 2px solid var(--control); border-radius: 0.25rem;
}
input[type="tel"], select { width: 100%; }
input[type="time"] { width: auto; }
input[aria-invalid="true"] { border-color: var(--bad); }
details.settings { margin: 1.5rem 0 0; border-top: 1px solid var(--line); padding-top: 0.5rem; }
details.settings summary { min-height: 3rem; display: flex; align-items: center; font-weight: 700; font-size: 1.125rem; cursor: pointer; }
.preview { margin: 0 0 0.75rem; font-size: 1.125rem; }
.post { width: 100%; background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 700; font-size: 1.25rem; }
.post[disabled] { opacity: 0.7; cursor: default; }
.msg { margin: 0.75rem 0 0; font-weight: 600; }
.msg:empty { display: none; }
.err { margin: 0.75rem 0 0; padding: 0.75rem 1rem; border: 2px solid var(--bad); border-radius: 0.25rem; font-weight: 600; }
.err:empty { display: none; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<main>
  <p class="clinic" id="clinic"></p>
  <section class="status" id="status" aria-live="polite" aria-atomic="true" data-kind="nodata">
    <h1 id="headline">Checking the wait time</h1>
    <p class="detail" id="detail"></p>
    <p class="updated" id="updated"></p>
  </section>
  <a class="call" id="call" href="#" hidden>Call the clinic</a>
  <p class="emergency" id="emergency"></p>
  <a class="stafflink" id="stafflink" href="#staff">Staff</a>

  <section class="staff" id="staff" hidden aria-labelledby="staff-h">
    <a class="back" href="#">Back to the patient view</a>
    <h2 id="staff-h">Staff update</h2>
    <p class="now" id="now"></p>
    <p class="nudge" id="nudge" hidden></p>
    <button type="button" class="btn confirm" id="confirm" hidden></button>

    <fieldset id="wait-set">
      <legend>Current wait</legend>
      <p class="readout" id="readout"></p>
      <div class="row" id="presets"></div>
      <div class="row" style="margin-top:0.5rem">
        <button type="button" class="btn" id="minus" aria-label="5 minutes less">−5</button>
        <button type="button" class="btn" id="plus" aria-label="5 minutes more">+5</button>
      </div>
    </fieldset>

    <fieldset id="today-set">
      <legend>Today</legend>
      <div class="choice"><input type="radio" name="today" id="today-normal" value="normal"><label for="today-normal">Normal hours</label></div>
      <div class="choice"><input type="radio" name="today" id="today-early" value="early"><label for="today-early">Closing early at</label>
        <input type="time" id="early-time" aria-label="Closing time today"></div>
      <div class="choice"><input type="radio" name="today" id="today-closed" value="closed"><label for="today-closed">Closed all day</label></div>
    </fieldset>

    <p class="preview" id="preview"></p>
    <button type="button" class="btn post" id="post">Post update</button>
    <p class="err" id="err" role="alert"></p>
    <p class="msg" id="msg" role="status"></p>

    <details class="settings" id="settings">
      <summary>Clinic settings: weekly hours, time zone, phone</summary>
      <fieldset id="hours-set" style="margin-top:0.75rem">
        <legend>Weekly hours</legend>
        <div id="hours"></div>
      </fieldset>
      <div style="margin-bottom:1.25rem">
        <label class="lbl" for="tz">Clinic time zone</label>
        <select id="tz">
          <option value="America/New_York">Eastern</option>
          <option value="America/Chicago">Central</option>
          <option value="America/Denver">Mountain</option>
          <option value="America/Phoenix">Arizona</option>
          <option value="America/Los_Angeles">Pacific</option>
          <option value="America/Anchorage">Alaska</option>
          <option value="Pacific/Honolulu">Hawaii</option>
        </select>
      </div>
      <div style="margin-bottom:1.25rem">
        <label class="lbl" for="phone">Clinic phone number</label>
        <input type="tel" id="phone" inputmode="tel" autocomplete="off">
      </div>
    </details>
  </section>
</main>

<script id="state" type="application/json">{"name": "Community Health Clinic (demo)", "phone": "(555) 010-0199", "tz": "America/New_York", "hours": {"sun": null, "mon": [480, 1020], "tue": [480, 1020], "wed": [480, 1020], "thu": [480, 1020], "fri": [480, 1020], "sat": [540, 780]}, "override": {"date": "2026-11-20", "closeAt": null}, "wait": 45, "updatedAt": "2026-11-21T03:25:58.343Z"}</script>

\"tel\" id=\"phone\" inputmode=\"tel\" autocomplete=\"off\">\n      \u003c/div>\n    \u003c/details>\n  \u003c/section>\n\u003c/main>\n\n\u003cscript id=\"state\" type=\"application/json\">@@STATE@@\u003c/script>\n\u003cscript>\nconst SRC = @@SRC@@;\n//LOGIC-START\nconst S = {\n  noWait: \"No wait right now\",\n  closed: \"The clinic is closed\",\n  closedToday: \"Closed for the rest of today. \",\n  closedDetail: \"Please call the clinic for urgent help.\",\n  opens: \"Opens \",\n  noData: \"No wait time has been posted yet\",\n  stale: \"We don't have a current wait time\",\n  callDetail: \"Please call the clinic for the current wait.\",\n  aging: \"This number is getting old. Please call to confirm before you leave.\",\n  emergency: \"In an emergency, call 911.\",\n  about: \"About \",\n  updated: \"Updated \",\n  lastUpdated: \"Last updated \",\n  justNow: \"just now\"\n};\nconst DAYS = [\"sun\", \"mon\", \"tue\", \"wed\", \"thu\", \"fri\", \"sat\"];\nconst DAY_NAMES = [\"Sunday\", \"Monday\", \"Tuesday\", \"Wednesday\", \"Thursday\", \"Friday\", \"Saturday\"];\nconst MAX_WAIT = 240, AGING_MIN = 45, STALE_MIN = 60, SKEW_MIN = 5;\nconst TOKEN_SRC = \"@@\" + \"SRC\" + \"@@\", TOKEN_STATE = \"@@\" + \"STATE\" + \"@@\";\n\nfunction validWait(n) { return typeof n === \"number\" && Number.isInteger(n) && n >= 0 && n \u003c= MAX_WAIT; }\nfunction parseTime(s) { const t = typeof s === \"string\" ? Date.parse(s) : NaN; return Number.isFinite(t) ? t : null; }\nfunction cleanPhone(p) { return typeof p === \"string\" && /^[0-9+()\\-.\\s]{7,20}$/.test(p.trim()) ? p.trim() : \"\"; }\nfunction telHref(p) { return \"tel:\" + p.replace(/[^0-9+]/g, \"\"); }\nfunction plural(n, w) { return n + \" \" + w + (n === 1 ? \"\" : \"s\"); }\nfunction formatWait(min) {\n  if (min \u003c 60) return plural(min, \"minute\");\n  const h = Math.floor(min / 60), m = min % 60;\n  return m ? plural(h, \"hour\") + \" \" + plural(m, \"minute\") : plural(h, \"hour\");\n}\nfunction relTime(ageMin) {\n  const m = Math.floor(ageMin);\n  if (m \u003c 1) return S.justNow;\n  if (m \u003c 60) return plural(m, \"minute\") + \" ago\";\n  return plural(Math.floor(m / 60), \"hour\") + \" ago\";\n}\nfunction defaultFmt(t) { return new Date(t).toLocaleTimeString([], { hour: \"numeric\", minute: \"2-digit\" }); }\nfunction fmtMin(m) { const h = Math.floor(m / 60), mm = m % 60; return (h % 12 || 12) + \":\" + String(mm).padStart(2, \"0\") + \" \" + (h >= 12 && h \u003c 24 ? \"PM\" : \"AM\"); }\n\n// Hours: every day present, each null (closed) or [openMinute, closeMinute] with open \u003c close, same calendar day.\nfunction validDay(v) { return v === null || (Array.isArray(v) && v.length === 2 && Number.isInteger(v[0]) && Number.isInteger(v[1]) && v[0] >= 0 && v[1] \u003c= 1440 && v[0] \u003c v[1]); }\nfunction validHours(h) { return !!h && typeof h === \"object\" && DAYS.every((d) => validDay(h[d])); }\n// Name of the first bad day (Monday first, as staff see them), or \"\" if the hours are fine.\nfunction hoursProblem(h) {\n  if (!h || typeof h !== \"object\") return \"the week\";\n  const bad = [1, 2, 3, 4, 5, 6, 0].find((i) => !validDay(h[DAYS[i]]));\n  return bad === undefined ? \"\" : DAY_NAMES[bad];\n}\nfunction validOverride(o) {\n  return o === null || (!!o && typeof o === \"object\" && typeof o.date === \"string\" && /^\\d{4}-\\d{2}-\\d{2}$/.test(o.date) &&\n    (o.closeAt === null || (Number.isInteger(o.closeAt) && o.closeAt >= 0 && o.closeAt \u003c= 1440)));\n}\nfunction validTz(tz) {\n  if (typeof tz !== \"string\" || tz === \"\") return false;\n  try { new Intl.DateTimeFormat(\"en-US\", { timeZone: tz }); return true; } catch (e) { return false; }\n}\n// Day, date and minute of day at the clinic, whatever the viewer's own time zone.\nfunction clinicClock(now, tz) {\n  if (!validTz(tz)) return null;\n  try {\n    const parts = new Intl.DateTimeFormat(\"en-US\", { timeZone: tz, year: \"numeric\", month: \"2-digit\", day: \"2-digit\", weekday: \"short\", hour: \"numeric\", minute: \"numeric\", hourCycle: \"h23\" }).formatToParts(new Date(now));\n    const get = (t) => parts.find((x) => x.type === t).value;\n    const day = DAYS.indexOf(get(\"weekday\").slice(0, 3).toLowerCase());\n    const hour = Number(get(\"hour\")), minute = Number(get(\"minute\"));\n    if (day \u003c 0 || !Number.isFinite(hour) || !Number.isFinite(minute)) return null;\n    return { day, date: get(\"year\") + \"-\" + get(\"month\") + \"-\" + get(\"day\"), min: (hour % 24) * 60 + minute };\n  } catch (e) { return null; }\n}\n// null = hours or time zone unusable (fail safe: tell patients to call).\n// An override (\"closed all day\" or \"closing early\") applies only on the clinic date it was set, so it expires at midnight.\nfunction scheduleAt(hours, tz, now, override) {\n  if (!validHours(hours)) return null;\n  const c = clinicClock(now, tz);\n  if (!c) return null;\n  let today = hours[DAYS[c.day]], overridden = false;\n  if (override && validOverride(override) && override.date === c.date) {\n    const was = today;\n    today = override.closeAt === null || !was || override.closeAt \u003c= was[0] ? null : [was[0], Math.min(was[1], override.closeAt)];\n    overridden = !!was && (today === null || today[1] \u003c was[1]);\n  }\n  if (today && c.min >= today[0] && c.min \u003c today[1]) return { open: true };\n  for (let i = 0; i \u003c= 7; i++) {\n    const di = (c.day + i) % 7, h = i === 0 ? today : hours[DAYS[di]];\n    if (!h) continue;\n    if (i === 0 && c.min >= h[0]) continue;\n    return { open: false, overridden: overridden && i > 0, next: { ahead: i, day: di, min: h[0] } };\n  }\n  return { open: false, overridden, next: null };\n}\nfunction nextText(n) {\n  const when = n.ahead === 0 ? \"today\" : n.ahead === 1 ? \"tomorrow\" : DAY_NAMES[n.day];\n  return S.opens + when + \" at \" + fmtMin(n.min) + \". \";\n}\n\n// The one place that decides what a patient sees. Pure: same input, same output.\nfunction describe(state, now, fmtTime) {\n  fmtTime = fmtTime || defaultFmt;\n  const st = state && typeof state === \"object\" ? state : {};\n  const phone = cleanPhone(st.phone);\n  const t = parseTime(st.updatedAt);\n  const out = (kind, headline, detail, updated) => ({ kind, headline, detail, updated, phone });\n  const sched = scheduleAt(st.hours, st.tz, now, st.override);\n  if (sched === null) return out(\"nodata\", S.noData, S.callDetail, \"\");\n  if (!sched.open) {\n    return out(\"closed\", S.closed, (sched.overridden ? S.closedToday : \"\") + (sched.next ? nextText(sched.next) : \"\") + S.closedDetail, \"\");\n  }\n  if (!validWait(st.wait) || t === null || t - now > SKEW_MIN * 60000) {\n    return out(\"nodata\", S.noData, S.callDetail, \"\");\n  }\n  const ageMin = Math.max(0, now - t) / 60000;\n  if (ageMin > STALE_MIN) {\n    return out(\"stale\", S.stale, S.callDetail, S.lastUpdated + fmtTime(t));\n  }\n  const updated = S.updated + fmtTime(t) + \" (\" + relTime(ageMin) + \")\";\n  if (st.wait === 0) return out(\"zero\", S.noWait, ageMin >= AGING_MIN ? S.aging : \"\", updated);\n  return out(ageMin >= AGING_MIN ? \"aging\" : \"wait\", S.about + formatWait(st.wait), ageMin >= AGING_MIN ? S.aging : \"\", updated);\n}\n\n// Staff input is the trust boundary: validate here, nowhere else.\n// override: undefined keeps the stored one, null clears it, {mode:\"closed\"} or {mode:\"early\", closeAt} sets it for the clinic's today.\nfunction nextState(prev, input, nowIso) {\n  prev = prev || {}; input = input || {};\n  if (!validWait(input.wait)) return { ok: false, error: \"wait\" };\n  const rawPhone = typeof input.phone === \"string\" ? input.phone.trim() : \"\";\n  if (rawPhone !== \"\" && cleanPhone(rawPhone) === \"\") return { ok: false, error: \"phone\" };\n  const hours = input.hours === undefined ? prev.hours : input.hours;\n  if (!validHours(hours)) return { ok: false, error: \"hours\", day: hoursProblem(hours) };\n  const tz = input.tz === undefined ? prev.tz : input.tz;\n  if (!validTz(tz)) return { ok: false, error: \"tz\" };\n  let override = input.override === undefined ? (validOverride(prev.override) ? prev.override : null) : null;\n  if (input.override !== undefined && input.override !== null) {\n    const o = input.override, c = clinicClock(Date.parse(nowIso), tz);\n    if (!c || !o || (o.mode !== \"closed\" && !(o.mode === \"early\" && Number.isInteger(o.closeAt) && o.closeAt >= 0 && o.closeAt \u003c= 1440))) return { ok: false, error: \"override\" };\n    override = { date: c.date, closeAt: o.mode === \"closed\" ? null : o.closeAt };\n  }\n  const clean = {};\n  DAYS.forEach((d) => { clean[d] = hours[d] === null ? null : [hours[d][0], hours[d][1]]; });\n  return { ok: true, state: { name: prev.name || \"\", phone: rawPhone, tz, hours: clean, override, wait: input.wait, updatedAt: nowIso } };\n}\n\n// \"Confirm\" re-posts the wait already on the page with a fresh time. It reuses every stored setting, so one tap cannot change anything else.\nfunction confirmInput(state) {\n  if (!state || typeof state !== \"object\" || !validWait(state.wait)) return null;\n  return { wait: state.wait, phone: typeof state.phone === \"string\" ? state.phone : \"\", hours: state.hours, tz: state.tz };\n}\nfunction confirmLabel(state) { return \"Confirm: still \" + (state.wait === 0 ? \"no wait\" : \"about \" + formatWait(state.wait)); }\n\nfunction safeJson(v) { return JSON.stringify(v).replace(/\u003c/g, \"\\\\u003c\").replace(/\\u2028/g, \"\\\\u2028\").replace(/\\u2029/g, \"\\\\u2029\"); }\n// Rebuild this exact page with new state. SRC is the page's own template.\nfunction buildPage(state) {\n  return SRC.replace(TOKEN_SRC, () => safeJson(SRC)).replace(TOKEN_STATE, () => safeJson(state));\n}\n//LOGIC-END\n\nconst $ = (id) => document.getElementById(id);\nconst DEFAULT_HOURS = { sun: null, mon: [480, 1020], tue: [480, 1020], wed: [480, 1020], thu: [480, 1020], fri: [480, 1020], sat: [540, 780] };\nlet STATE = {};\ntry { STATE = JSON.parse($(\"state\").textContent) || {}; } catch (e) { STATE = {}; }\nlet draft = { wait: validWait(STATE.wait) ? STATE.wait : 30 };\n\n// Write to the DOM only when something changed, so a screen reader is not re-told an unchanged status.\nfunction setText(el, text) { if (el.textContent !== text) el.textContent = text; }\nfunction setHidden(el, hidden) { if (el.hidden !== hidden) el.hidden = hidden; }\nfunction setAttr(el, name, value) { if (el.getAttribute(name) !== value) el.setAttribute(name, value); }\n\nfunction render() {\n  const d = describe(STATE, Date.now());\n  setText($(\"clinic\"), STATE.name || \"\");\n  setAttr($(\"status\"), \"data-kind\", d.kind);\n  setText($(\"headline\"), d.headline);\n  setText($(\"detail\"), d.detail); setHidden($(\"detail\"), !d.detail);\n  setText($(\"updated\"), d.updated); setHidden($(\"updated\"), !d.updated);\n  const call = $(\"call\");\n  if (d.phone) { setAttr(call, \"href\", telHref(d.phone)); setText(call, \"Call \" + d.phone); setHidden(call, false); }\n  else { setHidden(call, true); }\n  setText($(\"emergency\"), S.emergency);\n  renderNow(d);\n}\n\nfunction renderNow(d) {\n  const t = parseTime(STATE.updatedAt), age = t === null ? null : Math.max(0, (Date.now() - t) / 60000);\n  setText($(\"now\"), \"Patients see now: \" + d.headline + (age === null ? \".\" : \". Last posted \" + relTime(age) + \".\"));\n  const nudge = d.kind !== \"closed\" && (age === null || age >= AGING_MIN);\n  setText($(\"nudge\"), age === null ? \"No wait time is posted. Choose a wait and post it so patients can see it.\" : \"It has been \" + formatWait(Math.floor(age)) + \" since the last update. Confirm that the wait is unchanged, or choose a new wait and post.\");\n  setHidden($(\"nudge\"), !nudge);\n  const canConfirm = d.kind !== \"closed\" && confirmInput(STATE) !== null;\n  setHidden($(\"confirm\"), !canConfirm);\n  if (canConfirm) setText($(\"confirm\"), confirmLabel(STATE));\n}\n\nconst toMin = (v) => { const m = /^(\\d{2}):(\\d{2})$/.exec(v || \"\"); return m ? Number(m[1]) * 60 + Number(m[2]) : NaN; };\nconst toTime = (m) => String(Math.floor(m / 60)).padStart(2, \"0\") + \":\" + String(m % 60).padStart(2, \"0\");\nconst q = (d, c) => document.querySelector('input[data-d=\"' + d + '\"].' + c);\nfunction readHours() {\n  const h = {};\n  DAYS.forEach((d) => { h[d] = q(d, \"on\").checked ? [toMin(q(d, \"open\").value), toMin(q(d, \"close\").value)] : null; });\n  return h;\n}\nfunction syncRow(d) { const on = q(d, \"on\").checked; q(d, \"open\").disabled = !on; q(d, \"close\").disabled = !on; }\nfunction readOverride() {\n  const v = document.querySelector('input[name=\"today\"]:checked').value;\n  return v === \"closed\" ? { mode: \"closed\" } : v === \"early\" ? { mode: \"early\", closeAt: toMin($(\"early-time\").value) } : null;\n}\n\nfunction renderStaff() {\n  $(\"readout\").textContent = formatWait(draft.wait);\n  document.querySelectorAll(\"#presets .btn\").forEach((b) => b.setAttribute(\"aria-pressed\", String(Number(b.dataset.m) === draft.wait)));\n  $(\"early-time\").disabled = !$(\"today-early\").checked;\n  const res = nextState(STATE, { wait: draft.wait, phone: $(\"phone\").value, hours: readHours(), tz: $(\"tz\").value, override: readOverride() }, new Date().toISOString());\n  if (!res.ok) { $(\"preview\").textContent = \"Fix the highlighted entry before posting.\"; return; }\n  const p = describe(res.state, Date.now());\n  $(\"preview\").textContent = \"After you post, patients will see: \" + p.headline + (p.kind === \"closed\" ? \". \" + p.detail.split(\". \")[0] : \"\") + \".\";\n}\n\nfunction clearError() {\n  $(\"err\").textContent = \"\";\n  document.querySelectorAll('[aria-invalid=\"true\"]').forEach((e) => { e.removeAttribute(\"aria-invalid\"); e.removeAttribute(\"aria-describedby\"); });\n}\nfunction showError(text, field) {\n  $(\"err\").textContent = text;\n  if (field) { field.setAttribute(\"aria-invalid\", \"true\"); field.setAttribute(\"aria-describedby\", \"err\"); field.focus(); }\n}\nfunction s const S = {

  opens: "Opens ",
  noData: "No wait time has been posted yet",
  stale: "We don't have a current wait time",
  callDetail: "Please call the clinic for the current wait.",
  aging: "This number is getting old. Please call to confirm before you leave.",

function validWait(n) { return typeof n === "number" && Number.isInteger(n) && n >= 0 && n <= MAX_WAIT; }

// The one place that decides what a patient sees. Pure: same input, same output.

// Staff input is the trust boundary: validate here, nowhere else.

function nextState(prev, input, nowIso) {

const $ = (id) => document.getElementById(id);

// Publish a new copy of this page with the given state. Every failure says whether anything was posted.
async function submit(state) {

    row.className = "hrow";
    row.innerHTML = '<span class="day">' + DAY_NAMES[i] + '</span>' +
      '<label class="on"><input type="checkbox" class="on" data-d="' + d + '"> Open</label>' +
      '<input type="time" class="open" data-d="' + d + '" aria-label="' + DAY_NAMES[i] + ' opens">' +
      '<span class="sep" aria-hidden="true">to</span>' +
      '<input type="time" class="close" data-d="' + d + '" aria-label="' + DAY_NAMES[i] + ' closes">';
    $("hours").appendChild(row);
    row.querySelector("input.on").checked = !!v;
    row.querySelector("input.open").value = toTime(v ? v[0] : 480);
    row.querySelector("input.close").value = toTime(v ? v[1] : 1020);
    row.addEventListener("input", () => { syncRow(d); clearError(); renderStaff(); });
    syncRow(d);
  });
  $("tz").value = validTz(STATE.tz) ? STATE.tz : "America/New_York";
  $("tz").addEventListener("change", () => { clearError(); renderStaff(); });
  $("minus").addEventListener("click", () => { draft.wait = Math.max(0, draft.wait - 5); clearError(); renderStaff(); });
  $("plus").addEventListener("click", () => { draft.wait = Math.min(MAX_WAIT, draft.wait + 5); clearError(); renderStaff(); });
  $("phone").addEventListener("input", () => { clearError(); renderStaff(); });
  document.querySelectorAll('input[name="today"]').forEach((r) => r.addEventListener("change", () => { clearError(); renderStaff(); }));
  $("early-time").addEventListener("input", () => { clearError(); renderStaff(); });
  $("post").addEventListener("click", post);
  $("confirm").addEventListener("click", confirmWait);
  $("phone").value = cleanPhone(STATE.phone);
  // Show today's override if one is still in force on the clinic's own date.
  const c = clinicClock(Date.now(), STATE.tz), o = STATE.override;
  let mode = "normal";
  if (c && validOverride(o) && o && o.date === c.date) { mode = o.closeAt === null ? "closed" : "early"; if (o.closeAt !== null) $("early-time").value = toTime(o.closeAt); }
  if (!$("early-time").value) $("early-time").value = "13:00";
  $("today-" + mode).checked = true;
  renderStaff();
  try {
    const v = sessionStorage.getItem("clinic-post");
    if (v) {
      sessionStorage.removeItem("clinic-post");
      if (STATE.updatedAt === v) say("Posted. Patients now see: " + describe(STATE, Date.now()).headline + ".");
      else showError("Your update was not posted because the page changed at the same moment. Check the current wait above, then post again.", null);
    }
  } catch (e) { /* ignore */ }
}

function route() {
  const staff = location.hash === "#staff";
  setHidden($("staff"), !staff); setHidden($("stafflink"), staff);
}
window.addEventListener("hashchange", route);
document.addEventListener("visibilitychange", () => { if (!document.hidden) render(); });
setup(); route(); render();
setInterval(render, 30000);
</script>
</body>
</html>
